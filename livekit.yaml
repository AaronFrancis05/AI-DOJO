# LiveKit server config for the self-hosted tutoring deployment.
# Mounted read-only into the container by docker-compose.livekit.yml.
#
# There is deliberately NO `keys:` block here. The API secret is supplied at
# run time through the LIVEKIT_KEYS environment variable in
# docker-compose.livekit.yml, which reads it from LIVEKIT_API_SECRET and
# refuses to start the container when that is unset. A secret committed to
# this file is a secret in the repository — anyone holding it can mint a token
# for any room. Generate one with:  openssl rand -hex 32

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # Set false only when the server has a routable public address configured.
  use_external_ip: true

# Rooms are created on demand when the first participant joins with a valid
# token, and torn down shortly after the last one leaves. Bookings already
# gate who can obtain a token (see app/api/live/token/route.ts), so no
# pre-provisioning step is needed.
room:
  auto_create: true
  empty_timeout: 300        # seconds a room lingers with nobody in it
  departure_timeout: 20

logging:
  level: info
