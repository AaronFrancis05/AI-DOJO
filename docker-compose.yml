# Production compose — built standalone image.
# Neon / Upstash / AI providers remain external (configure via .env).
#
# Usage:
#   npm run docker:prod
#   # or: docker compose up --build -d
#   Open http://localhost:3000
#
# Switch to development:
#   npm run docker:dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-dojo:latest
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Overrides Docker's auto HOSTNAME (container name). Required behind Traefik
      # when the app is on both default and proxy networks — otherwise Next may bind
      # only to 172.25.0.2 and Traefik's 172.19.0.3:3000 stays 502 for the container lifetime.
      HOSTNAME: "0.0.0.0"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
