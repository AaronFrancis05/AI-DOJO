# Production compose — built standalone image.
# Neon / Upstash / AI providers remain external (configure via .env).
#
# Usage:
#   npm run docker:prod
#   # or: docker compose up --build -d
#   Open http://localhost:3000
#
# Switch to development:
#   npm run docker:dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-dojo:latest
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
