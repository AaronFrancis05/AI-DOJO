# Self-hosted LiveKit for the live tutoring feature.
#
# Deliberately a SEPARATE compose file from the app's own docker-compose.yml:
# the media server has a very different lifecycle (host networking, a wide UDP
# range, its own TLS story) and should be brought up and torn down
# independently of the web app.
#
#   docker compose -f docker-compose.livekit.yml up -d
#
# Then set in .env:
#   NEXT_PUBLIC_TUTORS_ENABLED=1
#   LIVEKIT_URL=ws://localhost:7880
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=<the secret; this compose file passes it to the server>
#
# PRODUCTION NOTES — this compose file is a development/self-host starting
# point, not a hardened deployment:
#   * Browsers require wss:// (not ws://) for camera/mic on any non-localhost
#     origin. Terminate TLS in front of LiveKit and point LIVEKIT_URL at it.
#   * Generate a real API secret; never ship the development default.
#   * Participants behind symmetric NAT need TURN. The turn section below is
#     commented out because it needs a real domain and certificate.
#   * Open UDP 50000-60000 (media) and TCP 7880/7881 on the host firewall.

services:
  livekit:
    # Pinned: `latest` makes the media server's version a function of when the
    # host last pulled, which is not something a deployment should vary on.
    image: livekit/livekit-server:v1.8
    container_name: dojo-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # The API secret is NOT committed to livekit.yaml. `:?` refuses to start
      # the container when LIVEKIT_API_SECRET is unset, so LiveKit can never
      # come up on a default or empty secret.
      LIVEKIT_KEYS: "devkey: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set — see .env.example}"
    # Host networking so the WebRTC UDP range doesn't need per-port mapping.
    # On Docker Desktop (macOS/Windows) host mode is limited — use the
    # `ports` block below instead and expect to configure TURN.
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # ports:
    #   - "7880:7880"                 # HTTP / WebSocket signalling
    #   - "7881:7881"                 # WebRTC over TCP fallback
    #   - "50000-60000:50000-60000/udp"  # WebRTC media

  # TURN relay for participants whose network blocks direct UDP.
  # Needs a real domain + certificate, so it is off by default.
  # turn:
  #   image: coturn/coturn:latest
  #   container_name: dojo-turn
  #   restart: unless-stopped
  #   network_mode: host
  #   command: >
  #     -n --listening-port=3478
  #     --realm=example.com
  #     --use-auth-secret --static-auth-secret=<same as livekit.yaml>
