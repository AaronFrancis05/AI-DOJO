# Development compose — bind-mount source for hot reload.
# Neon / Upstash / AI providers remain external (configure via .env).
#
# Usage:
#   npm run docker:dev
#   # or: docker compose -f docker-compose.dev.yml up --build
#   Open http://localhost:3000

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-dojo:dev
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # Keep container node_modules; do not overwrite with host mount
      - app_node_modules:/app/node_modules
      # Persist Next.js cache across restarts
      - app_next_cache:/app/.next
    restart: unless-stopped

volumes:
  app_node_modules:
  app_next_cache:
